version: '3.8'

services:
  dadtgroup11app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dadtgroup11app
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      - mysqldbcontainer
    networks:
      - devops

  web:
    image: nginx:latest
    container_name: dadtgroup11web
    ports:
      - "8080:80"
    volumes:
      - ./laravel:/var/www/html
      - ./nginx/conf:/etc/nginx/conf.d
    depends_on:
      - dadtgroup11app
    networks:
      - devops

  mysqldbcontainer:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=64M
    container_name: mysqldbcontainer
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: password
    volumes:
      - mysqldbdatavolume:/var/lib/mysql
    networks:
      - devops

networks:
  devops:

volumes:
  mysqldbdatavolume:
